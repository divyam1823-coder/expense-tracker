<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Transaction - Simple Expense Tracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top Navigation -->
  <header>
    <div class="container navbar">
      <a href="index.html" class="brand">
        <div class="brand-icon">💳</div>
        <span>TrackWise</span>
      </a>
      <button class="mobile-toggle" aria-label="Toggle navigation">☰</button>
      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">📊 Dashboard</a></li>
        <li><a href="expenses.html" class="nav-link">📋 All Expenses</a></li>
        <li><a href="add-expense.html" class="nav-link">➕ Add Transaction</a></li>
        <li><a href="reports.html" class="nav-link">📈 Reports</a></li>
      </ul>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="container">
    <div class="page-header" style="justify-content: center; text-align: center;">
      <div>
        <h1 class="page-title">Add New Transaction</h1>
        <p class="page-subtitle">Record an expense or deposit to keep your records up-to-date.</p>
      </div>
    </div>

    <div class="card form-card">
      <!-- Type Toggle -->
      <label class="form-label">Transaction Type</label>
      <div class="type-toggle-group">
        <button type="button" class="type-toggle-btn active expense" id="btn-type-expense">
          <span>📉</span> Expense
        </button>
        <button type="button" class="type-toggle-btn" id="btn-type-income">
          <span>📈</span> Income
        </button>
      </div>

      <form id="transaction-form">
        <!-- Hidden input for type -->
        <input type="hidden" id="tx-type" value="expense">

        <!-- Title / Description -->
        <div class="form-group">
          <label class="form-label" for="tx-title">Title / Description *</label>
          <input type="text" id="tx-title" class="form-control" placeholder="e.g., Grocery shopping, Client invoice, Dinner" required>
        </div>

        <!-- Amount -->
        <div class="form-group">
          <label class="form-label" for="tx-amount">Amount ($) *</label>
          <input type="number" id="tx-amount" class="form-control" placeholder="0.00" step="0.01" min="0.01" required>
        </div>

        <!-- Category -->
        <div class="form-group">
          <label class="form-label" for="tx-category">Category *</label>
          <select id="tx-category" class="form-control" required>
            <!-- Injected dynamically based on type -->
          </select>
        </div>

        <!-- Date -->
        <div class="form-group">
          <label class="form-label" for="tx-date">Date *</label>
          <input type="date" id="tx-date" class="form-control" required>
        </div>

        <!-- Notes -->
        <div class="form-group">
          <label class="form-label" for="tx-notes">Notes (Optional)</label>
          <textarea id="tx-notes" class="form-control" rows="3" placeholder="Add any details, receipt notes, payment method..."></textarea>
        </div>

        <!-- Submit Buttons -->
        <div style="display: flex; gap: 12px; margin-top: 24px;">
          <button type="submit" class="btn btn-primary" style="flex: 1; justify-content: center;">Save Transaction</button>
          <a href="expenses.html" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>&copy; 2026 TrackWise - Simple Multi-page Expense Tracker.</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script>
    const expenseCategories = [
      'Food', 'Housing', 'Transportation', 'Utilities', 
      'Entertainment', 'Shopping', 'Health', 'Other Expense'
    ];

    const incomeCategories = [
      'Salary', 'Freelance', 'Investments', 'Other Income'
    ];

    const btnExpense = document.getElementById('btn-type-expense');
    const btnIncome = document.getElementById('btn-type-income');
    const typeInput = document.getElementById('tx-type');
    const categorySelect = document.getElementById('tx-category');
    const dateInput = document.getElementById('tx-date');
    const form = document.getElementById('transaction-form');

    // Default to today's date in YYYY-MM-DD
    const today = new Date().toISOString().split('T')[0];
    dateInput.value = today;

    function setType(type) {
      typeInput.value = type;
      if (type === 'expense') {
        btnExpense.className = 'type-toggle-btn active expense';
        btnIncome.className = 'type-toggle-btn';
        populateCategories(expenseCategories);
      } else {
        btnIncome.className = 'type-toggle-btn active income';
        btnExpense.className = 'type-toggle-btn';
        populateCategories(incomeCategories);
      }
    }

    function populateCategories(categories) {
      categorySelect.innerHTML = categories.map(cat => {
        const icon = CATEGORY_ICONS[cat] || '';
        return `<option value="${cat}">${icon} ${cat}</option>`;
      }).join('');
    }

    btnExpense.addEventListener('click', () => setType('expense'));
    btnIncome.addEventListener('click', () => setType('income'));

    // Initialize with expense categories
    populateCategories(expenseCategories);

    // Form Submission
    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const title = document.getElementById('tx-title').value.trim();
      const amount = parseFloat(document.getElementById('tx-amount').value);
      const category = categorySelect.value;
      const date = dateInput.value;
      const notes = document.getElementById('tx-notes').value.trim();
      const type = typeInput.value;

      if (!title || isNaN(amount) || amount <= 0 || !date || !category) {
        alert('Please fill out all required fields with valid values.');
        return;
      }

      addTransaction({
        title,
        amount,
        type,
        category,
        date,
        notes
      });

      showToast(`Added ${type === 'income' ? 'Income' : 'Expense'}: ${title}`);

      // Short delay then navigate to expenses page
      setTimeout(() => {
        window.location.href = 'expenses.html';
      }, 700);
    });
  </script>
</body>
</html>
